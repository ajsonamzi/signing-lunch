<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#132A1C">
<title>Photographs — Nande &amp; Ayanda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#132A1C; --pine:#1D3B28; --moss:#3C6444; --spring:#7FA55C;
    --sage:#C3D3B6; --paper:#F6F8F2; --paper-edge:#E7EDE0;
    --ink:#17281B; --ink-soft:#4A5C4C;
    --serif:'Cormorant Garamond','Hoefler Text',Georgia,serif;
    --sans:'Karla','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #244A30 0%, rgba(36,74,48,0) 60%),
      radial-gradient(90% 60% at 90% 110%, #1B3A26 0%, rgba(27,58,38,0) 55%),
      var(--canopy);
    color:var(--ink); font-family:var(--serif); min-height:100vh;
    padding:clamp(20px,4vw,56px);
    display:flex; align-items:flex-start; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative; width:min(54rem,100%);
    background:linear-gradient(180deg,var(--paper) 0%, var(--paper) 82%, var(--paper-edge) 100%);
    border-radius:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 70px -30px rgba(5,20,10,.75), 0 4px 14px rgba(5,20,10,.35);
    padding:clamp(34px,6vw,60px) clamp(20px,4vw,48px) clamp(32px,5vw,50px);
    overflow:hidden;
    animation:arrive .9s cubic-bezier(.22,.9,.28,1) both;
  }
  .card::before{content:""; position:absolute; inset:10px;
    border:1px solid rgba(60,100,68,.22); pointer-events:none;}
  @keyframes arrive{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}

  /* the garden, the vines, the sprigs and the blossoms come from garden.js;
     the sprigs are sized down a little for a card with a heading near its top */
  .card{--sprig-tl:min(160px,28%); --sprig-br:min(180px,32%); --sprig-tl-phone:34%; --sprig-br-phone:38%;}
  @media (max-width:520px){ .card{padding-left:20px; padding-right:20px;} }

  header{text-align:center; position:relative;}
  .eyebrow{font-family:var(--sans); font-weight:300; font-size:.76rem;
    letter-spacing:.24em; color:var(--moss); margin:0 0 1.3rem;}
  h1{font-size:clamp(2.1rem,7vw,3rem); font-weight:300; line-height:1.1; margin:0; color:var(--pine);}
  .intro{font-size:clamp(1rem,2.3vw,1.12rem); line-height:1.75; font-weight:300;
    color:var(--ink-soft); margin:1.3rem auto 0; max-width:27rem;}

  .rule{width:110px; height:1px; margin:2.2rem auto; border:0;
    background:linear-gradient(90deg,transparent,var(--sage),transparent);}

  /* columns give a natural masonry, so portrait and landscape sit together
     without cropping either into a square */
  .grid{columns:3 200px; column-gap:14px;}
  .shot{
    break-inside:avoid; margin:0 0 14px; padding:0;
    border:0; background:none; cursor:zoom-in; display:block; width:100%;
    border-radius:2px; overflow:hidden; position:relative;
    box-shadow:0 2px 10px rgba(5,20,10,.14);
    transition:transform .4s cubic-bezier(.22,.9,.28,1), box-shadow .4s ease;
  }
  .shot img{width:100%; height:auto; display:block; border-radius:2px;}
  .shot:hover{transform:translateY(-3px); box-shadow:0 10px 22px rgba(5,20,10,.22);}
  .shot:focus-visible{outline:2px solid var(--spring); outline-offset:3px;}

  .empty{
    text-align:center; color:var(--ink-soft); font-weight:300; font-size:1.02rem;
    line-height:1.8; padding:2.4rem 1rem; border:1px dashed rgba(60,100,68,.28);
    border-radius:3px;
  }

  .foot{text-align:center; margin:2.4rem 0 0;}
  .back{font-family:var(--sans); font-size:.84rem; color:var(--moss); text-decoration:none;
    border-bottom:1px solid rgba(60,100,68,.4); padding-bottom:2px;}
  .back:hover{color:var(--pine); border-color:var(--pine);}

  /* ---------- lightbox ---------- */
  .lb{
    position:fixed; inset:0; z-index:10; background:rgba(8,22,13,.93);
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.4rem;
    padding:clamp(12px,3vw,40px);
    animation:fade .3s ease both;
  }
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .lb__figure{margin:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-width:0; max-height:100%;}
  .lb__figure img{
    max-width:100%; max-height:82vh; width:auto; height:auto; display:block;
    border-radius:2px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .lb__cap{
    font-family:var(--sans); font-size:.8rem; letter-spacing:.06em; font-weight:300;
    color:var(--sage); margin-top:1rem; text-align:center; min-height:1.2em;
  }
  .lb__btn{
    font-family:var(--serif); color:var(--paper); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22); border-radius:999px;
    width:46px; height:46px; font-size:1.6rem; line-height:1; cursor:pointer;
    display:grid; place-items:center; transition:background .2s ease;
  }
  .lb__btn:hover{background:rgba(255,255,255,.2);}
  /* display:grid above would otherwise beat the hidden attribute, and a
     single photograph showed arrows that went nowhere */
  .lb__btn[hidden]{display:none;}
  .lb__close{position:absolute; top:clamp(10px,2vw,24px); right:clamp(10px,2vw,24px);
    font-size:1.3rem; z-index:2;}
  @media (max-width:560px){
    .lb{grid-template-columns:1fr;}
    .lb__btn.lb__nav{position:absolute; bottom:clamp(14px,4vw,30px);}
    .lb__prev{left:22%;} .lb__next{right:22%;}
  }

  :focus-visible{outline:2px solid var(--spring); outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
<script src="garden.js"></script>
</head>
<body>

<main class="card">

  <header data-reveal>
    <p class="eyebrow">before the day</p>
    <h1>A few photographs</h1>
    <p class="intro">From the engagement, while we were still getting used to the idea. Tap any of them to see it properly.</p>
  </header>

  <hr class="rule" data-reveal>

  <div class="grid" id="grid"></div>

  <p class="foot" data-reveal><a class="back" href="./#invitation">Back to the invitation</a></p>
</main>

<script>
/* ================================================================
   Add each engagement photo here, in the order they should appear.
   Put the files in a photos/ folder next to this page.

     { src: "photos/01.jpg", alt: "Nande and Ayanda in the garden", w: 1600, h: 1067 }

   alt is read aloud by screen readers and shown if an image fails,
   so describe the picture rather than naming the file.

   w and h are the photo's width and height in pixels. They are optional,
   but with them the wall is laid out before the photos arrive, instead of
   jumping about as each one loads. Export photos at about 1600px on the
   long side: straight off a phone they are several megabytes each, and
   most guests will open this on mobile data.
   ================================================================ */
const PHOTOS = [
];

const $ = (id) => document.getElementById(id);
const grid = $("grid");
const garden = window.Garden || { reveal(){} };

if (!PHOTOS.length){
  grid.outerHTML = '<p class="empty" id="empty">The photographs are still being chosen.<br>Do come back — they will be here before the day.</p>';
  garden.reveal($("empty"));
} else {
  PHOTOS.forEach((photo, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "shot";
    btn.setAttribute("aria-label", photo.alt ? "Open: " + photo.alt : "Open photograph");

    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.alt || "";
    if (photo.w && photo.h){ img.width = photo.w; img.height = photo.h; }
    /* the first few are wanted immediately; the rest can wait until scrolled to */
    img.loading = i < 4 ? "eager" : "lazy";
    img.decoding = "async";
    /* A photo that cannot be found leaves no gap in the wall, and is struck
       off the list the lightbox walks, so a mistyped filename cannot become a
       blank slide or throw the "3 of 9" count out. */
    img.addEventListener("error", () => { photo.missing = true; btn.remove(); });

    btn.appendChild(img);
    btn.addEventListener("click", () => open_(photo, btn));
    grid.appendChild(btn);
  });
  garden.reveal(grid.children, { stagger: 80 });
}

/* ---------- lightbox ---------- */
let at = 0, box = null, shown = [], opener = null;

function open_(photo, from){
  if (box) return;   /* already open: a double tap must not stack a second one */
  opener = from || null;
  /* only the photographs that actually loaded */
  shown = PHOTOS.filter(p => !p.missing);
  at = Math.max(0, shown.indexOf(photo));
  box = document.createElement("div");
  box.className = "lb";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", "Photograph");
  box.innerHTML =
    '<button class="lb__btn lb__close" id="lbClose" aria-label="Close">&#10005;</button>' +
    '<button class="lb__btn lb__nav lb__prev" id="lbPrev" aria-label="Previous photograph">&#8249;</button>' +
    '<figure class="lb__figure"><img id="lbImg" alt=""><figcaption class="lb__cap" id="lbCap"></figcaption></figure>' +
    '<button class="lb__btn lb__nav lb__next" id="lbNext" aria-label="Next photograph">&#8250;</button>';
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";

  $("lbClose").addEventListener("click", close_);
  $("lbPrev").addEventListener("click", () => step(-1));
  $("lbNext").addEventListener("click", () => step(1));
  box.addEventListener("click", (e) => { if (e.target === box) close_(); });
  addEventListener("keydown", onKey);
  swipe(box);
  show();
  $("lbClose").focus();
}

function show(){
  const photo = shown[at];
  if (!photo) return close_();
  $("lbImg").src = photo.src;
  $("lbImg").alt = photo.alt || "";
  $("lbCap").textContent = (at + 1) + " of " + shown.length;
  const one = shown.length < 2;
  $("lbPrev").hidden = one;
  $("lbNext").hidden = one;
  /* fetch the neighbours now, so the next swipe is instant */
  if (!one){
    [shown[(at + 1) % shown.length], shown[(at - 1 + shown.length) % shown.length]]
      .forEach(p => { const i = new Image(); i.src = p.src; });
  }
}

function step(by){
  at = (at + by + shown.length) % shown.length;
  show();
}

function close_(){
  removeEventListener("keydown", onKey);
  document.body.style.overflow = "";
  if (box) box.remove();
  box = null;
  /* back to the photograph they opened, not the top of the page */
  if (opener && opener.isConnected) opener.focus({ preventScroll: true });
  opener = null;
}

function onKey(e){
  if (e.key === "Escape") close_();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Tab" && box){
    /* keep the keyboard inside the open photograph */
    const stops = [...box.querySelectorAll("button")].filter(b => !b.hidden);
    const first = stops[0], last = stops[stops.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if (!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  }
}

/* a flick left or right moves through them on a phone */
function swipe(el){
  let x0 = null;
  el.addEventListener("touchstart", (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
}
</script>
</body>
</html>
