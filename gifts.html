<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#132A1C">
<title>A few things — Nande &amp; Ayanda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#132A1C; --pine:#1D3B28; --moss:#3C6444; --spring:#7FA55C;
    --sage:#C3D3B6; --paper:#F6F8F2; --paper-edge:#E7EDE0;
    --ink:#17281B; --ink-soft:#4A5C4C;
    --serif:'Cormorant Garamond','Hoefler Text',Georgia,serif;
    --sans:'Karla','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #244A30 0%, rgba(36,74,48,0) 60%),
      radial-gradient(90% 60% at 90% 110%, #1B3A26 0%, rgba(27,58,38,0) 55%),
      var(--canopy);
    color:var(--ink); font-family:var(--serif); min-height:100vh;
    padding:clamp(20px,4vw,56px);
    display:flex; align-items:flex-start; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative; width:min(40rem,100%);
    background:linear-gradient(180deg,var(--paper) 0%, var(--paper) 78%, var(--paper-edge) 100%);
    border-radius:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 70px -30px rgba(5,20,10,.75), 0 4px 14px rgba(5,20,10,.35);
    padding:clamp(34px,7vw,64px) clamp(22px,6vw,58px) clamp(34px,6vw,54px);
    overflow:hidden;
    animation:arrive .9s cubic-bezier(.22,.9,.28,1) both;
  }
  .card::before{content:""; position:absolute; inset:10px;
    border:1px solid rgba(60,100,68,.22); pointer-events:none;}
  @keyframes arrive{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}

  .sprig{position:absolute; top:-8px; left:-12px; width:min(170px,34%); pointer-events:none;
    animation:sway 9s ease-in-out 1.8s infinite;}
  @keyframes sway{0%,100%{transform:rotate(0deg) translate3d(0,0,0);}
    50%{transform:rotate(1.2deg) translate3d(0,-5px,0);}}

  header{text-align:center; position:relative;}
  .eyebrow{font-family:var(--sans); font-weight:300; font-size:.76rem;
    letter-spacing:.24em; color:var(--moss); margin:0 0 1.3rem;}
  h1{font-size:clamp(2.1rem,7vw,3rem); font-weight:300; line-height:1.1;
    margin:0; color:var(--pine);}
  .intro{font-size:clamp(1rem,2.3vw,1.12rem); line-height:1.75; font-weight:300;
    color:var(--ink-soft); margin:1.4rem auto 0; max-width:27rem;}

  .rule{width:110px; height:1px; margin:2.2rem auto; border:0;
    background:linear-gradient(90deg,transparent,var(--sage),transparent);}

  .field{display:block; max-width:22rem; margin:0 auto 2rem; text-align:left;}
  .field span{font-family:var(--sans); font-size:.74rem; letter-spacing:.14em;
    color:var(--moss); display:block; margin-bottom:.45rem;}
  .field input{width:100%; font-family:var(--serif); font-size:1.1rem; color:var(--ink);
    background:var(--paper); border:1px solid rgba(60,100,68,.28); border-radius:2px;
    padding:.7rem .85rem;}
  .field input:focus{outline:2px solid var(--spring); outline-offset:1px;}

  ul.gifts{list-style:none; margin:0; padding:0;}
  .gift{
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    padding:.95rem 0; border-bottom:1px solid rgba(60,100,68,.14);
  }
  .gift:last-child{border-bottom:0;}
  .gift__text{flex:1 1 12rem; min-width:0;}
  .gift__name{font-size:1.16rem; color:var(--pine); line-height:1.4;}
  .gift__note{display:block; font-size:.95rem; color:var(--ink-soft); font-weight:300; margin-top:.15rem;}
  .gift__act{flex:0 0 auto;}

  .claim{
    font-family:var(--sans); font-size:.82rem; font-weight:400; color:var(--pine);
    background:transparent; border:1px solid rgba(60,100,68,.35); border-radius:999px;
    padding:.55rem 1.15rem; cursor:pointer; white-space:nowrap;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .claim:hover{border-color:var(--moss); background:rgba(127,165,92,.14);}
  .gift.is-taken{opacity:.55;}
  .gift.is-taken .gift__name{text-decoration:line-through; text-decoration-color:rgba(60,100,68,.4);}
  .taken{
    font-family:var(--sans); font-size:.76rem; letter-spacing:.1em; color:var(--moss);
    border:1px solid transparent; padding:.55rem .4rem; white-space:nowrap;
  }

  .status{font-size:1rem; color:var(--moss); margin:1.4rem 0 0; min-height:1.4em;
    font-style:italic; text-align:center;}

  .foot{text-align:center; margin:2.4rem 0 0;}
  .back{font-family:var(--sans); font-size:.84rem; color:var(--moss); text-decoration:none;
    border-bottom:1px solid rgba(60,100,68,.4); padding-bottom:2px;}
  .back:hover{color:var(--pine); border-color:var(--pine);}

  :focus-visible{outline:2px solid var(--spring); outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<main class="card">
  <svg class="sprig" viewBox="0 0 260 220" aria-hidden="true">
    <g fill="none" stroke="#3C6444" stroke-width="1.3" stroke-linecap="round" opacity=".75">
      <path d="M8 6 C 60 40, 90 70, 120 120"/><path d="M60 40 C 78 32, 96 34, 112 46"/>
      <path d="M90 70 C 104 92, 108 112, 104 134"/><path d="M120 120 C 148 132, 172 130, 196 116"/>
      <path d="M30 20 C 34 44, 30 62, 18 78"/>
    </g>
    <g fill="#FFFFFF" stroke="#C3D3B6" stroke-width=".6">
      <circle cx="112" cy="46" r="6"/><circle cx="124" cy="38" r="4"/><circle cx="104" cy="34" r="3.4"/>
      <circle cx="104" cy="134" r="6.4"/><circle cx="96" cy="146" r="4"/><circle cx="112" cy="146" r="3.4"/>
      <circle cx="196" cy="116" r="7"/><circle cx="208" cy="106" r="4.4"/><circle cx="204" cy="126" r="3.6"/>
      <circle cx="18" cy="78" r="6"/><circle cx="10" cy="90" r="3.6"/><circle cx="26" cy="90" r="3.2"/>
    </g>
  </svg>

  <header>
    <p class="eyebrow">if you'd like to</p>
    <h1>A few things<br>we'd love</h1>
    <p class="intro">Please don't feel any obligation — you at the table is the whole point. But a few people have asked, so here is the honest list. Put your name to anything and we'll know it's spoken for.</p>
  </header>

  <hr class="rule">

  <label class="field">
    <span>Your name</span>
    <input type="text" id="guestName" placeholder="Who's asking?" autocomplete="name">
  </label>

  <ul class="gifts" id="gifts"></ul>

  <p class="status" id="status"></p>

  <p class="foot"><a class="back" href="./">Back to the invitation</a></p>
</main>

<script>
const CONFIG = {
  whatsapp: "27607415890",

  /* Paste the Google Apps Script web-app URL here to turn on shared
     tracking: the page will then show what is already spoken for to
     everyone. Left empty, claims are sent by WhatsApp instead and
     nothing is shared between guests. */
  claimEndpoint: "https://script.google.com/macros/s/AKfycbyqA6ntOEJCfEBOg4Fm3seZvpJfefh2aakY4POFkBT6B9Z3ZM26iVfQprwYlv1iv8k/exec",

  gifts: [
    { name: "Kenwood stand mixer", note: "The big one — a few of you could go in together." },
    { name: "Nespresso machine" },
    { name: "Cast iron pots" },
    { name: "Knife set" },
    { name: "Blender" },
    { name: "Ice cream churner" },
    { name: "Sandwich maker" },
    { name: "Pestle and mortar" },
    { name: "Baking tins" },
    { name: "Bakeware" },
    { name: "Dinnerware set" },
    { name: "Airtight glass storage" },
    { name: "Bedding", note: "Double bed — duvet set." },
    { name: "Cotton towel and sheet set" },
    { name: "First aid kit" },
    { name: "Plants", many: true },
    { name: "Vouchers", note: "Groceries, fuel, hardware — all genuinely useful.", many: true },
    { name: "Financial contribution", note: "Ask us and we'll send the details.", many: true, ask: true }
  ]
};

const $ = (id) => document.getElementById(id);
const status = $("status");
const list = $("gifts");
const claimed = new Set();

const render = () => {
  list.innerHTML = "";
  CONFIG.gifts.forEach((g, i) => {
    const taken = !g.many && claimed.has(g.name);
    const li = document.createElement("li");
    li.className = "gift" + (taken ? " is-taken" : "");

    const text = document.createElement("div");
    text.className = "gift__text";
    const name = document.createElement("span");
    name.className = "gift__name";
    name.textContent = g.name;
    text.appendChild(name);
    if (g.note){
      const note = document.createElement("span");
      note.className = "gift__note";
      note.textContent = g.note;
      text.appendChild(note);
    }

    const act = document.createElement("div");
    act.className = "gift__act";
    if (taken){
      const tag = document.createElement("span");
      tag.className = "taken";
      tag.textContent = "Spoken for";
      act.appendChild(tag);
    } else {
      const btn = document.createElement("button");
      btn.className = "claim";
      btn.textContent = g.ask ? "Ask for details" : "I'll bring this";
      btn.addEventListener("click", () => claim(g, i));
      act.appendChild(btn);
    }

    li.append(text, act);
    list.appendChild(li);
  });
};

function claim(gift){
  const name = $("guestName").value.trim();
  if (!name){
    status.textContent = "Pop your name in first, so we know who to thank.";
    $("guestName").focus();
    return;
  }

  const message = gift.ask
    ? `Hi! It's ${name}. Could you send me the details for a contribution towards the signing lunch?`
    : `Hi! It's ${name}. I'd love to bring the ${gift.name.toLowerCase()} for the signing lunch.`;

  if (!CONFIG.claimEndpoint || gift.ask){
    open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(message), "_blank", "noopener");
    status.textContent = gift.ask
      ? "Opening WhatsApp so we can send the details."
      : "Opening WhatsApp — send the message and it's yours.";
    return;
  }

  /* We wait for the answer rather than firing and hoping: it lets us tell
     someone honestly when another guest claimed the same thing first. */
  status.textContent = "Just a moment\u2026";
  fetch(CONFIG.claimEndpoint, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ name: name, gift: gift.name, many: !!gift.many })
  })
    .then(r => r.json())
    .then(d => {
      if (d && d.ok){
        if (!gift.many) claimed.add(gift.name);
        status.textContent = "Thank you — we've put your name against it.";
      } else if (d && d.error === "taken"){
        claimed.add(gift.name);
        status.textContent = "Someone just beat you to that one — here is what is left.";
      } else {
        throw new Error("failed");
      }
      render();
    })
    .catch(() => {
      status.innerHTML = "That didn't save — please try again, or " +
        '<a href="https://wa.me/' + CONFIG.whatsapp + '?text=' +
        encodeURIComponent(message) +
        '" target="_blank" rel="noopener">tell us on WhatsApp</a>.';
    });
}

/* what other guests have already spoken for */
function load(){
  render();
  if (!CONFIG.claimEndpoint) return;
  fetch(CONFIG.claimEndpoint)
    .then(r => r.json())
    .then(rows => {
      (rows || []).forEach(r => r && r.gift && claimed.add(r.gift));
      render();
    })
    .catch(() => {});
}
load();
</script>
</body>
</html>
