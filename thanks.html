<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#132A1C">
<title>Thank you — Nande &amp; Ayanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#132A1C;
    --pine:#1D3B28;
    --moss:#3C6444;
    --spring:#7FA55C;
    --sage:#C3D3B6;
    --paper:#F6F8F2;
    --paper-edge:#E7EDE0;
    --ink:#17281B;
    --ink-soft:#4A5C4C;

    --serif:'Cormorant Garamond', 'Hoefler Text', Georgia, serif;
    --sans:'Karla', 'Helvetica Neue', Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}

  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #244A30 0%, rgba(36,74,48,0) 60%),
      radial-gradient(90% 60% at 90% 110%, #1B3A26 0%, rgba(27,58,38,0) 55%),
      var(--canopy);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    padding:clamp(20px,4vw,56px);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative;
    width:min(34rem,100%);
    background:linear-gradient(180deg,var(--paper) 0%, var(--paper) 72%, var(--paper-edge) 100%);
    border-radius:2px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 70px -30px rgba(5,20,10,.75),
      0 4px 14px rgba(5,20,10,.35);
    padding:clamp(38px,8vw,64px) clamp(24px,7vw,58px);
    text-align:center;
    overflow:hidden;
    animation:arrive .9s cubic-bezier(.22,.9,.28,1) both;
  }
  .card::before{
    content:""; position:absolute; inset:10px; border:1px solid rgba(60,100,68,.22);
    pointer-events:none; border-radius:1px;
  }
  @keyframes arrive{
    from{opacity:0; transform:translateY(16px) scale(.99);}
    to{opacity:1; transform:none;}
  }

  .sprig{position:absolute; top:-8px; left:-12px; width:min(190px,40%); pointer-events:none;}

  .eyebrow{
    font-family:var(--sans); font-weight:300; font-size:.76rem; letter-spacing:.24em;
    color:var(--moss); margin:0 0 1.5rem;
  }
  h1{
    font-size:clamp(2.4rem,9vw,3.4rem); font-weight:300; line-height:1.05;
    margin:0; color:var(--pine);
  }
  .note{
    font-size:clamp(1.02rem,2.4vw,1.16rem); line-height:1.75; font-weight:300;
    color:var(--ink-soft); margin:1.6rem auto 0; max-width:24rem;
  }

  .rule{
    width:110px; height:1px; margin:2.4rem auto; border:0;
    background:linear-gradient(90deg,transparent,var(--sage),transparent);
  }

  .actions{display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap;}
  .btn{
    font-family:var(--sans); font-size:.88rem; letter-spacing:.04em;
    padding:.85rem 1.6rem; border-radius:999px; cursor:pointer; border:1px solid var(--pine);
    background:var(--pine); color:var(--paper); text-decoration:none;
    display:inline-flex; align-items:center;
    transition:background .25s ease, transform .25s ease;
  }
  .btn:hover{background:var(--moss); transform:translateY(-1px);}
  .btn--quiet{background:transparent; color:var(--pine);}
  .btn--quiet:hover{background:rgba(127,165,92,.14);}

  .status{
    font-size:1rem; color:var(--moss); margin:1.1rem 0 0; min-height:1.4em; font-style:italic;
  }
  .countdown{
    font-size:1rem; color:var(--ink-soft); font-weight:300; margin:2rem 0 0;
  }
  .countdown strong{color:var(--spring); font-weight:500;}

  :focus-visible{outline:2px solid var(--spring); outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<main class="card">
  <svg class="sprig" viewBox="0 0 260 220" aria-hidden="true">
    <g fill="none" stroke="#3C6444" stroke-width="1.3" stroke-linecap="round" opacity=".75">
      <path d="M8 6 C 60 40, 90 70, 120 120"/>
      <path d="M60 40 C 78 32, 96 34, 112 46"/>
      <path d="M90 70 C 104 92, 108 112, 104 134"/>
      <path d="M120 120 C 148 132, 172 130, 196 116"/>
      <path d="M30 20 C 34 44, 30 62, 18 78"/>
    </g>
    <g fill="#FFFFFF" stroke="#C3D3B6" stroke-width=".6">
      <circle cx="112" cy="46" r="6"/><circle cx="124" cy="38" r="4"/><circle cx="104" cy="34" r="3.4"/>
      <circle cx="104" cy="134" r="6.4"/><circle cx="96" cy="146" r="4"/><circle cx="112" cy="146" r="3.4"/>
      <circle cx="196" cy="116" r="7"/><circle cx="208" cy="106" r="4.4"/><circle cx="204" cy="126" r="3.6"/>
      <circle cx="18" cy="78" r="6"/><circle cx="10" cy="90" r="3.6"/><circle cx="26" cy="90" r="3.2"/>
    </g>
  </svg>

  <p class="eyebrow">your reply is in</p>
  <h1>Thank you</h1>
  <p class="note">That's noted, and we're glad you told us. There'll be a long table in the last of the spring light, and now we know whether to leave a chair in it for you.</p>

  <hr class="rule">

  <div class="actions">
    <button class="btn" id="calBtn">Add to your calendar</button>
    <a class="btn btn--quiet" href="./">Back to the invitation</a>
  </div>

  <p class="status" id="status"></p>
  <p class="countdown" id="countdown"></p>
</main>

<script>
/* mirrors the matching values in index.html's CONFIG */
const EVENT = {
  nameA: "Nande",
  nameB: "Ayanda",
  venue: "GROUND The Venue",
  address: "Plot 19 Driefontein Rd, Muldersdrift, 1747",
  dress: "Garden formal",
  timeLabel: "Arrive from 12:00",
  startsAt: "2026-11-08T12:00:00+02:00",
  endsAt:   "2026-11-08T17:00:00+02:00"
};

const $ = (id) => document.getElementById(id);

$("calBtn").addEventListener("click", () => {
  const stamp = (iso) => new Date(iso).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//signing lunch//EN",
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "@signing-lunch",
    "DTSTAMP:" + stamp(new Date().toISOString()),
    "DTSTART:" + stamp(EVENT.startsAt),
    "DTEND:" + stamp(EVENT.endsAt),
    "SUMMARY:" + EVENT.nameA + " & " + EVENT.nameB + " — signing lunch",
    "LOCATION:" + EVENT.venue + ", " + EVENT.address,
    "DESCRIPTION:" + EVENT.timeLabel + ". " + EVENT.dress + ".",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");

  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "signing-lunch.ics";
  a.click();
  URL.revokeObjectURL(url);
  $("status").textContent = "Saved to your downloads — open it to add the day to your calendar.";
});

const days = Math.ceil((new Date(EVENT.startsAt) - new Date()) / 86400000);
const el = $("countdown");
if (days > 1) el.innerHTML = "<strong>" + days + " days</strong> until the long lunch.";
else if (days === 1) el.innerHTML = "<strong>Tomorrow.</strong> Very nearly time.";
else if (days === 0) el.innerHTML = "<strong>Today.</strong> See you at the table.";
</script>
</body>
</html>
